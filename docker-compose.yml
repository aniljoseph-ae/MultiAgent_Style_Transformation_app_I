version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-transformer:latest
    container_name: content-transformer
    ports:
      - "8000:8000"
    environment:
      - ULTRASAFE_API_KEY=${ULTRASAFE_API_KEY}
      - ULTRASAFE_BASE_URL=${ULTRASAFE_BASE_URL}
      - CHROMA_DB_PATH=/app/chroma_db
      - OPENAI_TELEMETRY_DISABLE=1
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped